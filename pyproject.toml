[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["integration: real FFmpeg audio operations"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".tooling", "build", "dist", "models", "output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
